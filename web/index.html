<meta charset="utf-8"><title>Claire — Mission Control</title>
<link rel="stylesheet" href="/style.css"><script src="/nav.js"></script>
<script>nav('/')</script>
<main>
  <h1>Mission Control <span id="conn" class="pill">connecting…</span></h1>
  <div id="banner"></div>

  <h2>Needs your decision</h2>
  <div id="approvals" class="muted">loading…</div>

  <h2>The desk — click any component to inspect &amp; configure</h2>
  <div class="lane"><span class="llabel">pipeline · scheduled screen →
    LLMs propose → human decides</span>
    <div class="desk" id="pipeline"></div></div>
  <div class="lane"><span class="llabel">deterministic money path · no LLM</span>
    <div class="desk" id="services"></div></div>
  <div class="lane"><span class="llabel">venues &amp; data</span>
    <div class="desk" id="venues"></div></div>

  <h2>Accounts &amp; system</h2>
  <div class="tiles" id="tiles"></div>
</main>

<div class="drawer" id="drawer">
  <div class="row" style="justify-content:space-between">
    <h3 id="d-title">—</h3>
    <button class="ghost" onclick="closeDrawer()">✕ close</button>
  </div>
  <div id="d-body"></div>
</div>

<script>
let GRAPH = null, PROVIDERS = [], APPROVALS = {cards: [], accounts: []};
let OVERVIEW = null, SCHEDULES = [], selected = null, fxCache = {};

const typing = () => ['INPUT', 'TEXTAREA', 'SELECT']
  .includes((document.activeElement || {}).tagName);

/* ── approvals with live estimates (v1 pattern) ──────────────────── */
function renderApprovals() {
  const el = document.getElementById('approvals');
  if (typing() && el.querySelector('input')) return;  // never yank the field
  const cards = APPROVALS.cards;
  el.innerHTML = cards.length === 0
    ? `<p class="muted">Nothing awaiting approval. Launch research from
       <a href="/markets">Markets</a> or ask <a href="/claire">Claire</a> —
       verdicts land here for your decision.</p>`
    : cards.map(card).join('');
  cards.forEach(a => updEst(a.id));
}
function card(a) {
  const t = a.thesis || {};
  const sell = t.direction === 'sell';
  const lock = a.locked ? `<p class="warn">🔒 locked — click 🔑 in the nav and
    paste the dashboard key from etc/claire.env</p>` : '';
  const closed = a.session && a.session.is_open === false
    ? `<p class="muted">⏸ ${a.session.exchange} is closed — an approved order
       queues until ${new Date(a.session.next_open).toLocaleString()}</p>` : '';
  return `<div class="card">
    <h3>${(t.direction || '?').toUpperCase()} ${esc(a.ticker)}
      <span class="pill">${a.kind}</span>
      <span class="pill">conviction ${fmt(t.conviction)}</span></h3>
    <p class="muted">entry ${fmt(t.entry_low)}–${fmt(t.entry_high)}
      · stop ${fmt(t.stop_loss)} · target ${fmt(t.take_profit)}
      · ${t.currency || ''} · expires ${ts(a.expires_at)}</p>
    ${(t.conditions || []).map(c => `<p>⚠ ${esc(c)}</p>`).join('')}
    ${closed}${lock}
    <div class="row">
      ${sell ? `<label>qty <input id="qty-${a.id}" type="number" value="0"
          style="width:90px" oninput="updEst('${a.id}')"></label>`
        : `<label>size <input id="size-${a.id}" type="number" value="1000"
          style="width:90px" oninput="updEst('${a.id}')"></label>`}
      <select id="broker-${a.id}" onchange="updEst('${a.id}')">
        <option>alpaca</option><option>saxo</option><option>moomoo</option>
      </select>
      <button ${a.locked ? 'disabled' : ''}
        onclick="act('${a.id}','approve','${a.token}',${sell})">✔ Approve</button>
      <button class="reject" ${a.locked ? 'disabled' : ''}
        onclick="act('${a.id}','reject','${a.token}')">✖ Reject</button>
    </div>
    <p class="muted" id="est-${a.id}" style="font-family:var(--mono);
      font-size:.78rem;margin-top:.4rem"></p></div>`;
}
async function updEst(id) {
  const a = APPROVALS.cards.find(x => x.id === id);
  const est = document.getElementById('est-' + id);
  if (!a || !est) return;
  const t = a.thesis || {};
  const broker = (document.getElementById('broker-' + id) || {}).value;
  const acct = APPROVALS.accounts.find(x => x.broker === broker);
  if (!acct) return;
  if (t.direction === 'sell') {
    est.textContent = 'exit sized in shares — proceeds credit ' + acct.id;
    return;
  }
  const size = Number((document.getElementById('size-' + id) || {}).value) || 0;
  const entry = t.entry_high || t.entry_low;
  let fx = 1, fxNote = '';
  if (entry && t.currency && t.currency !== acct.ccy) {
    const key = t.currency + acct.ccy;
    if (!(key in fxCache)) {
      try { fxCache[key] = Number((await api(`/api/fx?from=${t.currency}` +
        `&to=${acct.ccy}`)).rate); } catch { fxCache[key] = null; }
    }
    fx = fxCache[key];
    fxNote = fx ? ` · fx ${fmt(fx, 4)}` : ' · fx unavailable';
  }
  const entryBase = entry && fx ? entry * fx : null;
  const shares = entryBase ? Math.floor(size / entryBase) : null;
  const fee = feeFor(acct.fee_model, size);
  est.innerHTML = `≈ <b>${shares ?? '—'} shares</b> @ ~${fmt(entry)}
    ${t.currency || ''} · est fee <b>${fmt(fee)} ${acct.ccy}</b>
    · ${fmt(size / (acct.cash || 1) * 100, 1)}% of ${acct.id} cash
    (${fmt(acct.cash)} ${acct.ccy})${fxNote}
    ${size > acct.cash ? ' · <b class="bad">exceeds cash!</b>' : ''}`;
}
async function act(id, action, token, sell) {
  const body = {work_item_id: id, action, token};
  if (action === 'approve') {
    body.broker = document.getElementById('broker-' + id).value;
    if (sell) body.qty = Number(document.getElementById('qty-' + id).value);
    else body.size_base = Number(document.getElementById('size-' + id).value);
  }
  try { await api('/api/thesis-action', body); toast(action + 'd ✓'); }
  catch (e) { toast(e.message, false); }
  refresh();
}

/* ── the desk: staged pipeline strip (v1 pattern) ─────────────────── */
const STAGES = [
  // scheduled scans start here; prepare rides along (instrument resolution)
  {label: 'screen · prepare', agents: ['screener'], det: ['prepare']},
  {label: 'analyze', agents: ['fundamental', 'technical', 'news']},
  {label: 'debate', agents: ['bull', 'bear']},
  {label: 'arbitrate', agents: ['arbiter']},
  {label: 'approve', det: ['gate']},
  {label: 'execute', det: ['execute']},
  {label: 'record', agents: ['recorder']}];

function acard(id, title, sub, cls, sub2) {
  return `<div class="acard ${cls} ${selected === id ? 'sel' : ''}"
    onclick="openDrawer('${id}')"><b>${title}</b><br>
    <span class="sub">${sub}</span>${sub2 ?
      `<br><span class="sub">${sub2}</span>` : ''}</div>`;
}
function until(t) {
  const s = t - Date.now() / 1000;
  if (s < 0) return 'due';
  if (s < 5400) return 'in ' + Math.round(s / 60) + 'm';
  if (s < 172800) return 'in ' + Math.round(s / 3600) + 'h';
  return 'in ' + Math.round(s / 86400) + 'd';
}
function nextScan() {
  const times = SCHEDULES.filter(j => j.job.startsWith('analysis_') &&
    j.enabled && j.next_run_at).map(j => j.next_run_at);
  return times.length ? 'next scan ' + until(Math.min(...times)) : 'no scans';
}
function renderDesk() {
  const g = GRAPH;
  document.getElementById('pipeline').innerHTML = STAGES.map(s =>
    `<div class="stage"><div class="slabel">${s.label}</div>` +
    (s.agents || []).map(id => {
      const a = g.agents[id];
      return a ? acard(id, a.display_name || id,
        `${a.provider_id}/${(a.model || '').replace('claude-', '')}`,
        a.state, id === 'screener' ? nextScan() : null) : '';
    }).join('') +
    (s.det || []).map(id => acard(id, id,
      id === 'gate' ? 'human token ⏸' : 'no LLM', 'det')).join('') +
    '</div>').join('<div class="sep">›</div>');

  const h = OVERVIEW.health || {};
  const svc = (id, sub, state, sub2) => acard(id, id, sub, state, sub2);
  document.getElementById('services').innerHTML = [
    svc('watcher', (h.watcher || {}).ok || 'never ran',
        (h.watcher || {}).ok === 'ok' ? 'ok' : 'error',
        'breach → sell_review'),
    svc('custodian', (h.custodian || {}).ok || 'never ran',
        (h.custodian || {}).ok === 'ok' ? 'ok' : 'error'),
    (() => { const a = g.agents.claire_chat; return a ? acard('claire_chat',
      'Claire chat', `${a.provider_id}/${(a.model || '')
      .replace('claude-', '')}`, a.state) : ''; })(),
  ].join('');

  document.getElementById('venues').innerHTML =
    g.brokers.map(b => acard(b.broker, b.broker,
      `${b.adapter} · ${b.open_orders} open · ${fmt(b.cash, 0)} ${b.ccy}`,
      b.mcp && b.mcp.creds_present ? 'ok' : 'det')).join('') +
    acard('market', 'market data',
      'Yahoo' + (g.market_data.stale_keys ? ' · stale!' : ''),
      g.market_data.stale_keys ? 'error' : 'ok');
}

/* ── drawer: inspect, query, configure ───────────────────────────── */
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  selected = null; renderDesk();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer(); });

async function openDrawer(id) {
  selected = id; renderDesk();
  const d = document.getElementById('drawer');
  d.classList.add('open');
  document.getElementById('d-title').textContent = id;
  const body = document.getElementById('d-body');
  const g = GRAPH;
  if (g.agents[id]) {
    const a = g.agents[id];
    document.getElementById('d-title').textContent =
      (a.display_name || id) + ' — ' + a.state;
    body.innerHTML = '<p class="muted">loading activity…</p>';
    let act = {runs: [], narrative: null, cost_24h: 0};
    try { act = await api('/api/agent-activity?id=' + id); } catch {}
    const provOpts = PROVIDERS.map(pr => {
      const okc = a.requires.every(c => pr.capabilities[c]);
      return `<option value="${pr.id}" ${pr.id === a.provider_id ?
        'selected' : ''} ${okc ? '' : 'disabled'}>${pr.display_name}
        ${okc ? '' : '(incompatible)'}</option>`;
    }).join('');
    body.innerHTML = `
      <p class="muted">${a.tools.length ? 'tools: ' + a.tools.join(', ')
        : 'single structured call — no tools'} · $${fmt(act.cost_24h, 4)}
        spent in 24h</p>
      ${act.current ? `<p class="ok">● running now on
        ${esc(act.current.ticker || act.current.work_item_id || '—')}</p>`
        : '<p class="muted">idle right now</p>'}
      <h2>Ask ${id} directly</h2>
      <div class="row"><input id="d-q" style="flex:1" placeholder=
        "e.g. what did you conclude last, and why?"
        onkeydown="if(event.key==='Enter')askAgent('${id}')">
        <button class="ghost" onclick="askAgent('${id}')">Ask</button>
      </div>
      <p class="muted" style="font-size:.72rem">answers come from this
        agent's own model + prompt, grounded in its run history — for
        desk-wide questions use <a href="/claire">Claire</a></p>
      <div id="d-answer"></div>
      <h2>Recent runs</h2>
      ${act.runs.length === 0 ? `<p class="muted">Never run — launch a
        pipeline from Markets and this agent will light up.</p>`
        : `<table><tr><th>when</th><th>work item</th><th>status</th>
          <th>tokens</th><th>cost</th></tr>` + act.runs.map(r =>
          `<tr><td>${ago(r.started_at)}</td>
          <td>${esc(r.ticker || r.work_item_id || '—')}</td>
          <td class="${r.status === 'ok' ? 'ok' : r.status === 'error' ?
            'bad' : 'warn'}">${r.status}</td>
          <td>${r.tokens_in || 0}/${r.tokens_out || 0}</td>
          <td>$${fmt(r.cost_usd, 4)}</td></tr>`).join('') + '</table>'}
      ${act.narrative ? `<h2>Latest narrative
        (${esc(act.narrative.work_item)})</h2>
        <pre style="white-space:pre-wrap">${esc(act.narrative.text)}</pre>` : ''}
      <h2>Model &amp; provider</h2>
      <div class="row">
        <select id="p-prov">${provOpts}</select>
        <input id="p-model" value="${a.model}" style="flex:1">
        <button onclick="saveAgent('${id}')">Save</button>
        <button class="ghost" onclick="testProv()">Test</button></div>
      <details style="margin-top:.6rem"><summary class="muted">system prompt
        </summary><pre style="white-space:pre-wrap">${esc(a.system_prompt)}
        </pre></details>`;
    return;
  }
  const b = g.brokers.find(x => x.broker === id);
  if (b) {
    body.innerHTML = `<p>account <b>${b.account}</b>
      <span class="pill">${b.environment}</span><br>
      cash <b>${fmt(b.cash)}</b> ${b.ccy} · open orders
      <b>${b.open_orders}</b> · adapter <b>${b.adapter}</b></p>
      ${b.mcp ? `<p class="muted">MCP: <code>${esc(b.mcp.command)}</code><br>
        creds (${b.mcp.env_refs.join(', ') || 'none'}):
        <b class="${b.mcp.creds_present ? 'ok' : 'bad'}">
        ${b.mcp.creds_present ? 'present' : 'missing'}</b><br>
        ${esc(b.mcp.note)}</p>` : ''}`;
    return;
  }
  const desc = {
    prepare: 'Resolves the instrument: currency from the exchange suffix ' +
      '(GBp→GBP), venue lot size, desk.db registration. Deterministic — ' +
      'every entry point gets identical instruments.',
    gate: 'interrupt() — the run suspends here until you present the ' +
      'single-use token from an approval card. No LLM can pass it.',
    execute: 'Pre-placement guards, then session-aware order placement. ' +
      'Before any venue sees an order: positive quantity required, cash ' +
      'must cover cost + estimated fee, risk caps checked, exits capped ' +
      'at held quantity. No LLM in this file.',
    watcher: 'LLM-free stop-loss monitor: session-aware, escalating ' +
      're-alerts, launches sell-reviews. Publishes its own health.',
    custodian: 'Fills, order TTLs, approval expiry, orphan checks, ' +
      'reconciliation. Runs in-process (5 min) + systemd timer.',
    market: 'Yahoo Finance module. All access isolated in one file; ' +
      'last-good cache serves stale values under rate limits.'};
  body.innerHTML = `<p class="muted">${desc[id] || ''}</p>`;
}
async function askAgent(id) {
  const q = document.getElementById('d-q').value.trim();
  if (!q) return;
  const out = document.getElementById('d-answer');
  out.innerHTML = '<p class="muted">asking Claire…</p>';
  try {
    const r = await fetch('/api/agent-ask', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({agent_id: id, text: q})});
    const reader = r.body.getReader(); const dec = new TextDecoder();
    let buf = '', text = '';
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.kind === 'text') { text = ev.text;
          out.innerHTML = `<pre style="white-space:pre-wrap">${esc(text)}</pre>`; }
        if (ev.kind === 'error')
          out.innerHTML = `<p class="bad">${esc(ev.text)}</p>`;
      }
    }
  } catch (e) { out.innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
}
async function saveAgent(id) {
  try {
    await api('/api/agent', {id,
      provider_id: document.getElementById('p-prov').value,
      model: document.getElementById('p-model').value});
    toast('saved ✓');
  } catch (e) { toast(e.message, false); }
  refresh();
}
async function testProv() {
  const pid = document.getElementById('p-prov').value;
  toast('probing ' + pid + '…');
  try {
    const r = await api('/api/provider-test', {provider_id: pid});
    toast(r.ok ? `ok, ${r.latency_ms}ms` : `failed: ${r.error}`, !!r.ok);
  } catch (e) { toast(e.message, false); }
}

/* ── overview + SSE ──────────────────────────────────────────────── */
async function refresh() {
  [OVERVIEW, GRAPH, PROVIDERS, APPROVALS, SCHEDULES] = await Promise.all([
    api('/api/overview'), api('/api/agent-graph'), api('/api/providers'),
    api('/api/approvals'), api('/api/schedules')]);
  document.getElementById('banner').innerHTML = OVERVIEW.flags.length
    ? `<div class="banner">${OVERVIEW.flags.map(f =>
        `<div>⚠ ${esc(f)}</div>`).join('')}</div>` : '';
  renderApprovals();
  renderDesk();
  document.getElementById('tiles').innerHTML =
    OVERVIEW.cash.map(c => `<div class="tile"><b>${fmt(c.cash)}</b>
      <span>${c.account} (${c.ccy})</span></div>`).join('') +
    `<div class="tile"><b>${OVERVIEW.pending}</b><span>pending</span></div>` +
    `<div class="tile"><b class="${OVERVIEW.claire_api ? 'ok' : 'bad'}">
      ${OVERVIEW.claire_api ? 'up' : 'down'}</b><span>claire-api</span></div>`;
}
function connectSSE() {
  const dot = document.getElementById('conn');
  const es = new EventSource('/api/events');
  es.onopen = () => { dot.textContent = '● live'; dot.className = 'pill ok'; };
  es.onerror = () => { dot.textContent = '○ polling';
    dot.className = 'pill warn'; };
  es.onmessage = ev => {
    try {
      const e = JSON.parse(ev.data);
      if (['awaiting_approval', 'approved', 'rejected', 'expired', 'done',
           'failed', 'executing'].includes(e.to_state)) refresh();
    } catch {}
  };
}
refresh().then(() => {                 // deep-link from the Agents page
  const want = localStorage.getItem('openDrawer');
  if (want) { localStorage.removeItem('openDrawer'); openDrawer(want); }
});
connectSSE(); setInterval(refresh, 20000);
</script>
