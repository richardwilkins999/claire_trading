<meta charset="utf-8"><title>Claire — Mission Control</title>
<link rel="stylesheet" href="/style.css"><script src="/nav.js"></script>
<script>nav('/')</script>
<main>
  <h1>Mission Control <span id="conn" class="pill">connecting…</span></h1>
  <div class="statstrip" id="strip"></div>
  <div id="banner"></div>

  <div id="pending"></div>

  <h2>System map</h2>
  <div class="mapwrap"><svg id="map" viewBox="0 0 1240 486"
    preserveAspectRatio="xMidYMin meet"></svg></div>
  <div class="legend">
    <span><b class="sw" style="background:var(--good);
      box-shadow:0 0 7px var(--good)"></b>glowing = running now</span>
    <span><b class="sw" style="background:var(--good)"></b>configured
      &amp; ready</span>
    <span><b class="sw" style="background:var(--warn)"></b>degraded</span>
    <span><b class="sw" style="background:var(--bad)"></b>error — needs
      you</span>
    <span><b class="sw" style="background:#3a4d63"></b>never run</span>
  </div>
  <div class="legend">
    <span><i style="border-color:#2c4560;border-top-style:solid"></i>run flow</span>
    <span><i style="border-color:#1d6b62;border-top-style:dashed"></i>book
      writes &amp; data</span>
    <span><i style="border-color:#8a6a2a;border-top-style:dashed"></i>stop
      breach → sell review</span>
    <span style="color:var(--purple)">⚙ MCP status sits inside each venue</span>
    <span>hover for detail · click to inspect, question or configure</span>
  </div>

  <h2>Accounts</h2>
  <div class="tiles" id="tiles"></div>
</main>

<div class="drawer" id="drawer">
  <div class="row" style="justify-content:space-between">
    <h3 id="d-title">—</h3>
    <button class="ghost" onclick="closeDrawer()">✕ close</button>
  </div>
  <div id="d-body"></div>
</div>

<script>
let GRAPH = null, PROVIDERS = [];
let OVERVIEW = null, SCHEDULES = [], selected = null;

const typing = () => ['INPUT', 'TEXTAREA', 'SELECT']
  .includes((document.activeElement || {}).tagName);

/* ── system map ──────────────────────────────────────────────────── */
const L = {railX: 12, railW: 152, railH: 44, railGap: 14, railTop: 46,
  stageX: 200, stageW: 128, pitch: 148, nodeH: 40, nodeGap: 8, band: 122,
  gIn: 180, gLoop: 170};
const STAGES = [
  // screener and prepare are one step on the map: prepare is deterministic
  // bookkeeping the screener's pick flows straight through, and drawing it
  // as its own box implied a handover that is not there
  {label: 'SCREEN · PREPARE', ids: ['screener']},
  {label: 'ANALYZE ∥', ids: ['fundamental', 'technical', 'news']},
  {label: 'DEBATE', ids: ['bull', 'bear']},
  {label: 'ARBITRATE', ids: ['arbiter']},
  {label: 'APPROVE', ids: ['gate']},
  {label: 'EXECUTE', ids: ['execute']},
  {label: 'RECORD', ids: ['recorder']}];
const DET = {
  gate: ['🔒 approve', 'your token ⏸'],
  execute: ['execute', 'guards · place']};

function jobNext(prefix) {
  const t = SCHEDULES.filter(j => j.job.startsWith(prefix) && j.enabled &&
    j.next_run_at).map(j => j.next_run_at);
  if (!t.length) return 'off';
  const s = Math.min(...t) - Date.now() / 1000;
  if (s < 0) return 'due';
  if (s < 5400) return Math.round(s / 60) + 'm';
  if (s < 172800) return Math.round(s / 3600) + 'h';
  return Math.round(s / 86400) + 'd';
}
const cut = (s, n) => { s = String(s ?? '');
  return s.length > n ? s.slice(0, n - 1) + '…' : s; };

/* `href` makes the box a real link instead of a drawer trigger — used for the
   entry points, where the useful thing is to GO to the page that starts a
   run, not to read about it in a side panel. */
function node(id, x, y, w, h, title, sub, cls, extra, tip, href) {
  const sel = selected === id ? ' sel' : '';
  const dot = /entry/.test(cls) ? ''
    : `<circle class="dot" cx="${w - 11}" cy="12" r="3.5"/>`;
  const inner = `<rect class="body" width="${w}" height="${h}" rx="7"/>
    ${dot}
    <text class="nt" x="10" y="17">${esc(cut(title, 17))}</text>
    <text class="ns" x="10" y="30">${esc(cut(sub, 22))}</text>
    ${extra || ''}<title>${esc(tip || sub)}</title>`;
  if (href)
    return `<a href="${href}" class="mnode ${cls}${sel}"
      transform="translate(${x},${y})">${inner}</a>`;
  return `<g class="mnode ${cls}${sel}" transform="translate(${x},${y})"
    onclick="openDrawer('${id}')">${inner}</g>`;
}
function renderMap() {
  const g = GRAPH, h = g.health || {}, parts = [], edges = [];
  const arrow = (id, col) => `<marker id="${id}" markerWidth="7"
    markerHeight="7" refX="6.5" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 z" fill="${col}"/></marker>`;
  parts.push(`<defs>${arrow('af', '#2c4560')}${arrow('ai', '#1d6b62')}
    ${arrow('al', '#8a6a2a')}</defs>`);

  /* entry rail */
  parts.push(`<text class="mlabel" x="${L.railX}" y="34">ENTRY POINTS</text>`);
  // each entry point goes straight to the page you would start a run from
  const entries = [
    ['you', '👤 You', 'pick a stock →', '/markets'],
    ['sched', '🗓 Schedule', `scans in ${jobNext('analysis_')} · events ` +
      jobNext('event_scan'), '/agents'],
    ['claire', '💬 Claire', 'ask her to run one', '/claire']];
  entries.forEach(([id, t, s, href], i) => {
    const y = L.railTop + i * (L.railH + L.railGap);
    parts.push(node(id, L.railX, y, L.railW, L.railH, t, s, 'entry',
                    null, `go to ${href}`, href));
    edges.push(`<path class="medge" d="M ${L.railX + L.railW} ${y + L.railH / 2}
      H ${L.gIn} V ${L.band - 10}"/>`);
  });
  edges.push(`<path class="medge" marker-end="url(#af)"
    d="M ${L.gIn} ${L.band - 10} H ${L.stageX}"/>`);

  /* pipeline */
  STAGES.forEach((st, i) => {
    const x = L.stageX + i * L.pitch;
    const tot = st.ids.length * L.nodeH + (st.ids.length - 1) * L.nodeGap;
    const top = L.band - tot / 2;
    parts.push(`<text class="mlabel" x="${x}" y="34">${st.label}</text>`);
    st.ids.forEach((id, k) => {
      const y = top + k * (L.nodeH + L.nodeGap);
      if (DET[id]) {
        const [t, s] = DET[id];
        parts.push(node(id, x, y, L.stageW, L.nodeH, t, s, 'det ok',
          null, 'deterministic — always configured, no LLM'));
      } else {
        const a = g.agents[id];
        if (!a) return;
        const sub = a.state === 'error' || a.state === 'active'
          ? a.detail
          : `${a.provider_id}/${(a.model || '').replace('claude-', '')}`;
        parts.push(node(id, x, y, L.stageW, L.nodeH, a.display_name || id,
          sub, a.state, null,
          `${a.state} — ${a.detail}\n${a.provider_id}/${a.model}`));
      }
    });
    if (i < STAGES.length - 1)
      edges.push(`<path class="medge" marker-end="url(#af)"
        d="M ${x + L.stageW} ${L.band} H ${x + L.pitch}"/>`);
  });

  /* supporting systems */
  parts.push(`<text class="mlabel" x="190" y="292">SUPPORTING SYSTEMS</text>`);
  const md = g.market_data;
  parts.push(node('market', 190, 300, 128, 50, md.source, md.detail,
    md.state,
    `<text class="ns" x="10" y="43">${esc(cut('via ' + md.fallbacks, 22))}</text>`,
    `${md.state} — ${md.detail}`));
  const hs = k => (h[k] || {}).ok || 'never ran';
  const hc = k => (h[k] || {}).state || 'idle';
  parts.push(node('watcher', 450, 300, 128, 50, 'watcher', hs('watcher'),
    hc('watcher'),
    `<text class="ns" x="10" y="43">breach → sell review</text>`,
    `watcher is ${hs('watcher')} — last checked ${
      (h.watcher || {}).checked_at ? ago((h.watcher || {}).checked_at) : 'never'}`));
  parts.push(node('book', 640, 300, 128, 50, 'desk.db',
    `${g.book.positions} pos · ${g.book.open_orders} orders`, 'ok',
    `<text class="ns" x="10" y="43">the book</text>`,
    'the durable record — written only by the repository layer'));
  parts.push(node('custodian', 830, 300, 128, 50, 'custodian', hs('custodian'),
    hc('custodian'),
    `<text class="ns" x="10" y="43">fills · TTLs · expiry</text>`,
    `custodian is ${hs('custodian')} — last checked ${
      (h.custodian || {}).checked_at ? ago((h.custodian || {}).checked_at) : 'never'}`));

  /* venues group with MCP status inside each broker */
  const gx = 1000, gy = 262, gw = 148;
  const brokers = g.brokers || [];
  const gh = brokers.length * 54 + (brokers.length - 1) * 8 + 30;
  parts.push(`<g class="mgroup"><rect x="${gx}" y="${gy}" width="${gw}"
    height="${gh}" rx="9"/><text class="mlabel" x="${gx + 10}"
    y="${gy + 16}">VENUES</text></g>`);
  brokers.forEach((b, i) => {
    const y = gy + 26 + i * 62;
    const m = (g.mcps || []).find(x => x.broker === b.broker);
    const mcpTxt = m ? (m.creds_present ? `⚙ mcp ● ${m.id}`
      : `⚙ mcp ○ needs creds`) : '⚙ no mcp';
    const mcp = m ? `<text class="nm" x="10" y="46"
      fill="${m.creds_present ? 'var(--purple)' : 'var(--dim)'}"
      >${esc(cut(mcpTxt, 20))}</text>
      <rect x="6" y="36" width="118" height="14" fill="transparent"
        style="cursor:pointer" onclick="event.stopPropagation();
        openDrawer('mcp:${m.id}')"><title>inspect MCP server</title></rect>`
      : `<text class="nm" x="10" y="46" fill="var(--dim)">${mcpTxt}</text>`;
    parts.push(node(b.broker, gx + 10, y, 128, 54, b.broker,
      `${b.adapter} · ${b.open_orders} open`,
      b.state || 'idle', mcp, `${b.state} — ${b.detail}`));
  });

  /* edges between bands */
  const exX = L.stageX + 5 * L.pitch + L.stageW / 2;
  const recX = L.stageX + 6 * L.pitch + L.stageW / 2;
  const anX = L.stageX + 1 * L.pitch + L.stageW / 2;
  edges.push(`<path class="medge" marker-end="url(#af)"
    d="M ${exX} ${L.band + 20} V 246 H ${gx + gw / 2} V ${gy}"/>`);
  edges.push(`<path class="medge info" marker-end="url(#ai)"
    d="M ${recX} ${L.band + 20} V 232 H 704 V 300"/>`);
  edges.push(`<path class="medge info" marker-end="url(#ai)"
    d="M ${gx} ${gy + gh - 40} H 978 V 325 H 958"/>`);
  edges.push(`<path class="medge info" marker-end="url(#ai)"
    d="M 830 325 H 770"/>`);
  edges.push(`<path class="medge info" marker-end="url(#ai)"
    d="M 640 325 H 580"/>`);
  edges.push(`<path class="medge info" marker-end="url(#ai)"
    d="M 254 300 V 214 H ${anX} V 190"/>`);
  edges.push(`<path class="medge loop" marker-end="url(#al)"
    d="M 450 325 H ${L.gLoop} V ${L.band + 10} H ${L.stageX}"/>`);

  document.getElementById('map').innerHTML = edges.join('') + parts.join('');
}

/* ── drawer ──────────────────────────────────────────────────────── */
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  selected = null; renderMap();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer(); });

async function openDrawer(id) {
  selected = id; renderMap();
  const d = document.getElementById('drawer');
  d.classList.add('open');
  document.getElementById('d-title').textContent = id;
  const body = document.getElementById('d-body');
  const g = GRAPH;

  if (id.startsWith('mcp:')) {
    const m = (g.mcps || []).find(x => x.id === id.slice(4));
    document.getElementById('d-title').textContent = 'MCP · ' + m.id;
    body.innerHTML = `<p>serves broker <b>${esc(m.broker || '—')}</b>
      ${m.enabled ? '' : '<span class="pill bad">disabled</span>'}</p>
      <p class="muted">command<br><code>${esc(m.command.join(' '))}</code></p>
      <p>credentials (${m.env_refs.join(', ') || 'none needed'}):
        <b class="${m.creds_present ? 'ok' : 'bad'}">
        ${m.env_refs.length === 0 ? 'none needed'
          : m.creds_present ? 'present'
          : 'missing ' + m.missing_refs.join(', ')}</b></p>
      <p class="muted">${esc(m.note || '')}</p>
      <p class="muted">While credentials are missing this venue runs on the
        deterministic paper sim. Edit servers on
        <a href="/providers">Providers &amp; MCP</a>.</p>`;
    return;
  }
  if (id === 'book') {
    document.getElementById('d-title').textContent = 'desk.db — the book';
    body.innerHTML = `<p>${g.book.positions} open positions ·
      ${g.book.open_orders} live orders · ${g.book.pending} awaiting your
      approval</p>
      <p class="muted">The durable business record: immutable executions,
      FIFO lots, every cash movement. Written only by the repository layer —
      no LLM has ever written a row here.</p>
      <p><a href="/portfolio">Portfolio</a> ·
         <a href="/trading">Trading runs</a></p>`;
    return;
  }
  if (g.agents[id]) {
    const a = g.agents[id];
    document.getElementById('d-title').textContent =
      (a.display_name || id) + ' — ' + a.state;
    body.innerHTML = '<p class="muted">loading activity…</p>';
    let act = {runs: [], narrative: null, cost_24h: 0};
    try { act = await api('/api/agent-activity?id=' + id); } catch {}
    const provOpts = PROVIDERS.map(pr => {
      const okc = a.requires.every(c => pr.capabilities[c]);
      return `<option value="${pr.id}" ${pr.id === a.provider_id ?
        'selected' : ''} ${okc ? '' : 'disabled'}>${pr.display_name}
        ${okc ? '' : '(incompatible)'}</option>`;
    }).join('');
    body.innerHTML = `
      <p class="muted">${a.tools.length ? 'tools: ' + a.tools.join(', ')
        : 'single structured call — no tools'} · $${fmt(act.cost_24h, 4)}
        spent in 24h</p>
      ${id === 'screener' ? `<p class="muted">This step also covers
        <b>prepare</b>: whatever it picks is resolved deterministically —
        currency from the exchange suffix (GBp→GBP), venue lot size, desk.db
        registration — before the analysts see it. No LLM in that part.</p>`
        : ''}
      ${act.current ? `<p class="ok">● running now on
        ${esc(act.current.ticker || act.current.work_item_id || '—')}</p>`
        : '<p class="muted">idle right now</p>'}
      <h2>Ask ${id} directly</h2>
      <div class="row"><input id="d-q" style="flex:1" placeholder=
        "e.g. what did you conclude last, and why?"
        onkeydown="if(event.key==='Enter')askAgent('${id}')">
        <button class="ghost" onclick="askAgent('${id}')">Ask</button></div>
      <p class="muted" style="font-size:.72rem">answers come from this
        agent's own model + prompt, grounded in its run history — for
        desk-wide questions use <a href="/claire">Claire</a></p>
      <div id="d-answer"></div>
      <h2>Recent runs <span class="muted" style="font-weight:400;
        text-transform:none;letter-spacing:0">— click one to read it</span></h2>
      ${act.runs.length === 0 ? `<p class="muted">Never run — launch a
        pipeline from Markets and this agent will light up.</p>`
        : `<div class="runlist">` + act.runs.map((r, i) =>
          `<div class="runrow" id="rr-${i}" onclick="pickRun('${id}',${i},
            '${r.work_item_id || ''}')">
            <span class="rt">${esc(r.ticker || r.work_item_id || '—')}</span>
            <span class="muted">${ago(r.started_at)}</span>
            <span class="${r.status === 'ok' ? 'ok' : r.status === 'error' ?
              'bad' : 'warn'}">${r.status}</span>
            <span class="muted">${r.tokens_in || 0}/${r.tokens_out || 0} tok</span>
            <span class="muted">$${fmt(r.cost_usd, 4)}</span>
            <span>${r.has_narrative ? '📄' : ''}</span>
          </div>`).join('') + '</div>'}
      <div id="d-narr"></div>
      <h2>Model &amp; provider</h2>
      <div class="row">
        <select id="p-prov">${provOpts}</select>
        <input id="p-model" value="${a.model}" style="flex:1">
        <button onclick="saveAgent('${id}')">Save</button>
        <button class="ghost" onclick="testProv()">Test</button></div>
      <details style="margin-top:.6rem"><summary class="muted">system prompt
        </summary><pre style="white-space:pre-wrap">${esc(a.system_prompt)}
        </pre></details>`;
    window._runs = act.runs;
    const first = act.runs.findIndex(r => r.has_narrative);
    if (first >= 0) pickRun(id, first, act.runs[first].work_item_id);
    return;
  }
  const b = (g.brokers || []).find(x => x.broker === id);
  if (b) {
    body.innerHTML = `<p>account <b>${b.account}</b>
      <span class="pill">${b.environment}</span><br>
      cash <b>${fmt(b.cash)}</b> ${b.ccy} · open orders
      <b>${b.open_orders}</b> · adapter <b>${b.adapter}</b></p>
      ${b.mcp ? `<p class="muted">MCP: <code>${esc(b.mcp.command)}</code><br>
        creds (${b.mcp.env_refs.join(', ') || 'none'}):
        <b class="${b.mcp.creds_present ? 'ok' : 'bad'}">
        ${b.mcp.creds_present ? 'present' : 'missing'}</b></p>` : ''}
      <p><a href="/portfolio">top up / withdraw on Portfolio</a></p>`;
    return;
  }
  const desc = {
    gate: 'interrupt() — the run suspends here until you present the ' +
      'single-use token from an approval card above. No LLM can pass it.',
    execute: 'Pre-placement guards, then session-aware order placement. ' +
      'Positive quantity required, cash must cover cost + fee, risk caps ' +
      'checked, exits capped at held quantity. No LLM in this file.',
    watcher: 'LLM-free stop-loss monitor: session-aware, escalating ' +
      're-alerts, launches sell_reviews back into the pipeline. Publishes ' +
      'its own health so a dead safety net is visible.',
    custodian: 'The asynchronous back half of execute: polls venues for ' +
      'fills and writes them to the book, places queued orders at the open, ' +
      'expires approvals at the gate, cancels orders past TTL, flags drift.',
    market: 'Market-data chain. Configure sources on Providers &amp; MCP.'};
  body.innerHTML = `<p class="muted">${desc[id] || ''}</p>` +
    (['watcher', 'custodian'].includes(id)
      ? `<p><a href="/agents">change its schedule</a></p>` : '') +
    (id === 'market' ? `<p><a href="/providers">data sources</a></p>` : '');
}
async function pickRun(agentId, idx, workItem) {
  document.querySelectorAll('.runrow').forEach((el, i) =>
    el.classList.toggle('sel', i === idx));
  const out = document.getElementById('d-narr');
  if (!out) return;
  if (!workItem) { out.innerHTML =
    '<p class="muted">This run has no work item attached.</p>'; return; }
  out.innerHTML = '<p class="muted">loading write-up…</p>';
  try {
    const n = await api(`/api/agent-narrative?agent=${
      encodeURIComponent(agentId)}&work_item=${encodeURIComponent(workItem)}`);
    if (n.error) {
      out.innerHTML = `<h2>Output</h2><p class="muted">${esc(n.error)}</p>`;
      return;
    }
    const run = (window._runs || []).find(r => r.work_item_id === workItem)
    || {};
  const d = run.report || {};
  const list = (k, label) => (d[k] || []).length
    ? `<div style="margin-top:.3rem"><span class="muted" style="font-size:.66rem;
       text-transform:uppercase;letter-spacing:.07em">${label}</span>
       <ul style="margin:.15rem 0 0 1rem">${d[k].map(i =>
         `<li>${esc(i)}</li>`).join('')}</ul></div>` : '';
  const typed = (d.signal || d.side || d.direction) ? `
    <div class="narr" style="margin-bottom:.5rem">
      <b>${esc(d.signal || d.side || d.direction)}</b> · conviction
      ${fmt(d.conviction)}
      ${d.summary ? `<p style="margin:.35rem 0">${esc(d.summary)}</p>` : ''}
      ${list('key_findings', 'key findings — what gets passed on')}
      ${list('key_points', 'key points')}${list('rebuttals', 'rebuttals')}
      ${list('conditions', 'conditions')}</div>` : '';
  out.innerHTML = `
      ${run.trigger ? `<p class="muted" style="font-size:.72rem">⟲ run
        triggered by: ${esc(run.trigger)}</p>` : ''}
      <h2>Report · ${esc(workItem)}</h2>
      <p class="muted" style="font-size:.7rem;margin-top:-.3rem">the
        conclusion — and the only part passed to the next agent</p>
      ${typed}
      ${n.report ? `<div class="narr">${mdLite(n.report)}</div>`
        : (typed ? '' : '<p class="muted">This run left no report.</p>')}
      ${n.transcript ? `<details style="margin-top:.6rem">
        <summary class="muted">working notes — how it got there
          (not passed on)</summary>
        <div class="narr" style="margin-top:.4rem">${mdLite(n.transcript)}
        </div></details>` : ''}`;
  } catch (e) {
    out.innerHTML = `<p class="bad">${esc(e.message)}</p>`;
  }
}
async function askAgent(id) {
  const q = document.getElementById('d-q').value.trim();
  if (!q) return;
  const out = document.getElementById('d-answer');
  out.innerHTML = '<p class="muted">asking…</p>';
  try {
    const r = await fetch('/api/agent-ask', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({agent_id: id, text: q})});
    const reader = r.body.getReader(); const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.kind === 'text')
          out.innerHTML = `<pre style="white-space:pre-wrap">${esc(ev.text)}</pre>`;
        if (ev.kind === 'error')
          out.innerHTML = `<p class="bad">${esc(ev.text)}</p>`;
      }
    }
  } catch (e) { out.innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
}
async function saveAgent(id) {
  try {
    await api('/api/agent', {id,
      provider_id: document.getElementById('p-prov').value,
      model: document.getElementById('p-model').value});
    toast('saved ✓');
  } catch (e) { toast(e.message, false); }
  refresh();
}
async function testProv() {
  const pid = document.getElementById('p-prov').value;
  toast('probing ' + pid + '…');
  try {
    const r = await api('/api/provider-test', {provider_id: pid});
    toast(r.ok ? `ok, ${r.latency_ms}ms` : `failed: ${r.error}`, !!r.ok);
  } catch (e) { toast(e.message, false); }
}

/* ── overview + SSE ──────────────────────────────────────────────── */
function renderPending() {
  const n = OVERVIEW.pending;
  document.getElementById('pending').innerHTML = n
    ? `<div class="banner" style="border-color:var(--accent);
        background:rgba(53,214,255,.07);color:var(--accent)">
        <b>${n} decision${n > 1 ? 's' : ''} waiting for you</b> —
        <a href="/approvals">review the evidence and approve →</a></div>`
    : `<p class="muted" style="margin-bottom:1rem">No decisions pending.
       Verdicts appear on <a href="/approvals">Approvals</a>.</p>`;
}
function renderStrip() {
  const o = OVERVIEW, h = o.health || {};
  const pill = (label, val, cls) =>
    `<div class="stat"><span>${label}</span><b class="${cls || ''}">${val}</b></div>`;
  const hp = k => {
    const v = (h[k] || {ok: 'never ran'}).ok;
    return pill(k, v, v === 'ok' ? 'ok' : v === 'stale' ? 'warn' : 'bad');
  };
  const cash = o.cash.reduce((s, c) => s + c.cash, 0);
  document.getElementById('strip').innerHTML =
    pill('awaiting you', o.pending, o.pending ? 'warn' : '') +
    pill('claire-api', o.claire_api ? 'up' : 'down',
         o.claire_api ? 'ok' : 'bad') +
    hp('watcher') + hp('custodian') +
    pill('data', (GRAPH && GRAPH.market_data.source) || '—') +
    pill('paper cash', fmt(cash, 0));
}
async function refreshGraph() {
  try {
    GRAPH = await api('/api/agent-graph');
    renderMap(); renderStrip();
  } catch {}
}
async function refresh() {
  [OVERVIEW, GRAPH, PROVIDERS, SCHEDULES] = await Promise.all([
    api('/api/overview'), api('/api/agent-graph'), api('/api/providers'),
    api('/api/schedules')]);
  document.getElementById('banner').innerHTML = OVERVIEW.flags.length
    ? `<div class="banner">${OVERVIEW.flags.map(f =>
        `<div>⚠ ${esc(f)}</div>`).join('')}</div>` : '';
  renderStrip();
  renderPending();
  renderMap();
  document.getElementById('tiles').innerHTML =
    OVERVIEW.cash.map(c => `<div class="tile"><b>${fmt(c.cash)}</b>
      <span>${c.account} (${c.ccy})</span></div>`).join('');
}
function connectSSE() {
  const dot = document.getElementById('conn');
  const es = new EventSource('/api/events');
  es.onopen = () => { dot.textContent = '● live'; dot.className = 'pill ok'; };
  es.onerror = () => { dot.textContent = '○ polling';
    dot.className = 'pill warn'; };
  es.onmessage = ev => {
    try {
      const e = JSON.parse(ev.data);
      // agent-run changes drive the glow — repaint the map alone (cheap),
      // work-item transitions warrant a full refresh
      if (e.kind === 'agents') return refreshGraph();
      if (['awaiting_approval', 'approved', 'rejected', 'expired', 'done',
           'failed', 'executing'].includes(e.to_state)) refresh();
    } catch {}
  };
}
refresh().then(() => {
  const want = localStorage.getItem('openDrawer');
  if (want) { localStorage.removeItem('openDrawer'); openDrawer(want); }
});
connectSSE(); setInterval(refresh, 20000);
</script>
