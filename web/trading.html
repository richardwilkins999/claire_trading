<meta charset="utf-8"><title>Claire — Trading</title>
<link rel="stylesheet" href="/style.css"><script src="/nav.js"></script>
<script>nav('/trading')</script>
<main>
  <h1>Runs</h1>
  <div class="row">
    <input id="ticker" placeholder="ticker e.g. NVDA">
    <select id="exchange"><option>NASDAQ</option><option>NYSE</option>
      <option>LSE</option><option>SGX</option><option>HKEX</option>
      <option>TSE</option><option>ASX</option><option>XETRA</option>
      <option>PARIS</option><option>NSE</option></select>
    <button onclick="launch()">Run pipeline</button>
  </div>
  <h2>Work items — click a row for detail</h2><div id="runs"></div>
  <h2>Event feed</h2><pre id="feed" style="max-height:280px;overflow:auto"></pre>
</main>
<script>
const CCY = {NASDAQ:'USD',NYSE:'USD',LSE:'GBP',SGX:'SGD',HKEX:'HKD',TSE:'JPY',
             ASX:'AUD',XETRA:'EUR',PARIS:'EUR',NSE:'INR'};
let openId = null;
async function launch() {
  const ex = document.getElementById('exchange').value;
  const t = document.getElementById('ticker').value.trim().toUpperCase();
  if (!t) return toast('ticker?', false);
  try {
    const r = await api('/api/run', {ticker: t, exchange: ex,
      currency: CCY[ex], lot_size: ex === 'SGX' ? 100 : 1});
    toast('launched ' + r.work_item_id);
  } catch (e) { toast(e.message, false); }
}
const cls = {done:'ok', executing:'warn', awaiting_approval:'warn',
             failed:'bad', rejected:'muted', expired:'muted', running:'warn'};
let lastSig = null, DETAIL = {}, summaryOpen = false;

async function refresh() {
  const runs = await api('/api/runs');
  // only rebuild the table when something actually changed — a blind
  // re-render every 8s was collapsing whatever you had open
  const sig = runs.map(r => r.id + r.state + r.updated_at).join('|');
  if (sig !== lastSig) {
    lastSig = sig;
    document.getElementById('runs').innerHTML = '<table><tr><th>id</th>' +
      '<th>kind</th><th>ticker</th><th>state</th><th>updated</th></tr>' +
      runs.map(r => `<tr class="clickable ${openId === r.id ? 'sel' : ''}"
        onclick="toggle('${r.id}')">
        <td>${esc(r.id)}</td><td>${esc(r.kind)}</td><td>${esc(r.ticker)}</td>
        <td class="${cls[r.state] || ''}">${esc(r.state)}</td>
        <td class="muted">${ts(r.updated_at)}</td></tr>
        <tr id="d-${r.id}" style="display:${openId === r.id ? '' : 'none'}">
        <td colspan="5" id="dc-${r.id}"></td></tr>`).join('') + '</table>';
    if (openId) render(openId);          // restore the open panel as it was
  }
  const f = await api('/api/feed');
  document.getElementById('feed').textContent = f.events.slice(-60).reverse()
    .map(e => `${ts(e.ts)}  ${e.item_id}  ${e.actor}: ` +
      `${e.from_state || ''}→${e.to_state}`).join('\n');
}
function toggle(id) {
  openId = openId === id ? null : id;
  lastSig = null;                        // force one rebuild for the highlight
  document.querySelectorAll('[id^="d-"]').forEach(el =>
    el.style.display = 'none');
  if (openId) {
    document.getElementById('d-' + id).style.display = '';
    detail(id);
  }
}
async function detail(id) {
  if (!DETAIL[id]) {
    const el = document.getElementById('dc-' + id);
    if (el) el.innerHTML = '<span class="muted">loading…</span>';
    try { DETAIL[id] = await api('/api/run-detail?id=' +
      encodeURIComponent(id)); }
    catch (e) { if (el) el.innerHTML = `<p class="bad">${esc(e.message)}</p>`;
      return; }
  }
  render(id);
}
function render(id) {
  const el = document.getElementById('dc-' + id);
  const d = DETAIL[id];
  if (!el || !d) return;
  let html = '';
  const errEv = (d.events || []).filter(e => e.payload &&
    e.payload.includes('error')).slice(-1)[0];
  if (d.state === 'failed' && errEv) {
    let why = errEv.payload;
    try { why = (JSON.parse(errEv.payload).errors || [why]).join('\n'); }
    catch {}
    html += `<p class="bad">why it failed:</p><pre>${esc(why)}</pre>`;
  }
  if (d.thesis) html += `<p><b>Thesis</b>: ${esc(d.thesis.direction)}
    · conviction ${fmt(d.thesis.conviction)} · entry
    ${fmt(d.thesis.entry_low)}–${fmt(d.thesis.entry_high)} · stop
    ${fmt(d.thesis.stop_loss)} · target ${fmt(d.thesis.take_profit)}
    ${esc(d.thesis.currency || '')}</p>`;
  if ((d.agent_runs || []).length) html += '<p><b>LLM calls</b>: ' +
    d.agent_runs.map(a => `${esc(a.agent_id)} (${esc(a.status)}, $${
      fmt(a.cost_usd, 4)})`).join(' · ') + '</p>';
  if ((d.orders || []).length) html += '<p><b>Orders</b>: ' +
    d.orders.map(o => `${esc(o.side)} ${fmt(o.qty)} — ${esc(o.status)}`)
      .join(' · ') + '</p>';
  if (d.summary) html += `<details id="sum-${id}" ${summaryOpen ? 'open' : ''}
    ontoggle="summaryOpen=this.open">
    <summary class="muted">run summary</summary>
    <div class="narr">${mdLite(d.summary)}</div></details>`;
  html += `<p class="muted" style="font-size:.72rem">events: ${
    (d.events || []).map(e => `${e.from_state || ''}→${e.to_state}`)
      .join(', ')}</p>`;
  el.innerHTML = html || '<span class="muted">no detail</span>';
}
refresh(); setInterval(refresh, 8000);
</script>
