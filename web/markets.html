<meta charset="utf-8"><title>Claire — Markets</title>
<link rel="stylesheet" href="/style.css"><script src="/nav.js"></script>
<script src="/charts.js"></script>
<script>nav('/markets')</script>
<main>
  <h1>Markets</h1>
  <div class="row">
    <select id="exchange" onchange="loadExchange()">
      <option>NASDAQ</option><option>NYSE</option><option>LSE</option>
      <option>SGX</option><option>HKEX</option><option>TSE</option>
      <option>ASX</option><option>XETRA</option><option>PARIS</option>
      <option>NSE</option>
    </select>
    <div id="exinfo" class="card" style="flex:1;margin:0">loading…</div>
  </div>

  <div class="tabs">
    <button id="tab-all" class="on" onclick="setTab('all')">All stocks</button>
    <button id="tab-tv" onclick="setTab('tv')">TradingView picks</button>
    <span class="muted" id="listnote"></span>
  </div>
  <div id="list">loading…</div>

  <div id="detail" style="display:none">
    <h2 id="dtitle">—</h2>
    <div class="row" style="margin-bottom:.5rem">
      <select id="range" onchange="loadChart()">
        <option value="1mo">1mo</option><option value="6mo" selected>6mo</option>
        <option value="1y">1y</option><option value="2y">2y</option>
      </select>
      <label><input type="checkbox" id="t-sma20" checked
        onchange="loadChart(true)"> SMA20</label>
      <label><input type="checkbox" id="t-sma50" checked
        onchange="loadChart(true)"> SMA50</label>
      <label><input type="checkbox" id="t-vol" checked
        onchange="loadChart(true)"> Volume</label>
      <label><input type="checkbox" id="t-rsi" onchange="loadChart(true)">
        RSI</label>
      <span style="flex:1"></span>
      <button onclick="sendToPipeline()">Send to Claire's pipeline</button>
    </div>
    <div id="chart"></div>
  </div>

  <h2>Worldwide search</h2>
  <div class="row"><input id="q" placeholder="search any listed company…"
    style="flex:1"><button class="ghost" onclick="search()">Search</button></div>
  <div id="results"></div>
</main>
<script>
const SUFFIX = {SGX: '.SI', HKEX: '.HK', TSE: '.T', ASX: '.AX', XETRA: '.DE',
  PARIS: '.PA', NSE: '.NS', LSE: '.L'};
const CCY = {NASDAQ: 'USD', NYSE: 'USD', LSE: 'GBP', SGX: 'SGD', HKEX: 'HKD',
  TSE: 'JPY', ASX: 'AUD', XETRA: 'EUR', PARIS: 'EUR', NSE: 'INR'};
let tab = 'all', rows = [], sortKey = 'mcap', sortDir = -1;
let sel = null, chartData = null, clockTimer = null, EXTZ = 'UTC';

function ex() { return document.getElementById('exchange').value; }

async function loadExchange() {
  document.getElementById('exinfo').innerHTML = 'loading…';
  document.getElementById('detail').style.display = 'none';
  loadList();
  try {
    const i = await api('/api/exchange-info?exchange=' + ex());
    EXTZ = i.tz;
    const idx = i.index || {};
    const chip = i.is_open
      ? '<span class="pill ok">● TRADING NOW</span>'
      : `<span class="pill bad">closed — opens ${new Date(i.next_open)
          .toLocaleString()}</span>`;
    document.getElementById('exinfo').innerHTML = `
      <div class="row" style="justify-content:space-between">
        <div><b style="font-size:1.1rem">${i.exchange}</b> ${chip}<br>
          <span class="muted">local time <b id="clock">…</b> (${i.tz})<br>
          hours ${i.open_time}–${i.close_time}
          ${i.lunch_break ? ' · lunch ' + i.lunch_break : ''}
          · session ends ${new Date(i.session_close).toLocaleTimeString()}
          </span></div>
        <div>${idx.level ? `index <b>${fmt(idx.level)}</b>
          <b class="${idx.change_pct >= 0 ? 'ok' : 'bad'}">
          ${idx.change_pct == null ? '' : (idx.change_pct >= 0 ? '+' : '') +
            fmt(idx.change_pct) + '%'}</b>
          <span class="muted">(${idx.symbol})</span><br>
          <span class="muted">index day volume ${fmtBig(idx.day_volume)}
          · listings ${fmt(i.listings, 0)}</span>`
          : `<span class="muted">index data unavailable
             ${idx.error ? '(' + idx.error + ')' : ''}</span>`}</div>
      </div>`;
    clearInterval(clockTimer);
    const tick = () => {
      const el = document.getElementById('clock');
      if (el) el.textContent = new Date().toLocaleTimeString('en-GB',
        {timeZone: EXTZ});
    };
    tick(); clockTimer = setInterval(tick, 1000);
  } catch (e) {
    document.getElementById('exinfo').innerHTML =
      `<span class="bad">${e.message}</span>`;
  }
}

function setTab(t) {
  tab = t;
  document.getElementById('tab-all').className = t === 'all' ? 'on' : '';
  document.getElementById('tab-tv').className = t === 'tv' ? 'on' : '';
  loadList();
}

async function loadList() {
  const el = document.getElementById('list');
  el.innerHTML = '<p class="muted">loading…</p>';
  try {
    if (tab === 'all') {
      const d = await api('/api/screener?exchange=' + ex() +
        '&sort=' + (sortKey === 'price' ? 'intradayprice' : 'intradaymarketcap'));
      rows = d.rows.map(r => ({...r, ticker: r.symbol}));
      document.getElementById('listnote').textContent =
        `top ${rows.length} of ${fmt(d.total, 0)} listings (Yahoo)`;
    } else {
      const d = await api('/api/tv-recs?exchange=' + ex());
      rows = d.rows.map(r => ({...r,
        symbol: r.ticker + (SUFFIX[ex()] || '')}));
      document.getElementById('listnote').textContent =
        'TradingView technical-rating leaders (unofficial API)';
    }
    renderList();
  } catch (e) { el.innerHTML = `<p class="bad">${e.message}</p>`; }
}

function sortBy(k) {
  sortDir = sortKey === k ? -sortDir : -1;
  sortKey = k;
  renderList();
}
function renderList() {
  const cols = tab === 'all'
    ? [['symbol', 'symbol'], ['name', 'name'], ['price', 'price'],
       ['change_pct', 'chg %'], ['volume', 'volume'], ['mcap', 'mkt cap'],
       ['pe', 'P/E']]
    : [['ticker', 'ticker'], ['name', 'name'], ['price', 'price'],
       ['change_pct', 'chg %'], ['volume', 'volume'], ['mcap', 'mkt cap'],
       ['rsi', 'RSI'], ['rating_label', 'rating']];
  const data = [...rows].sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (x == null) return 1; if (y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
  });
  document.getElementById('list').innerHTML = '<table><tr>' +
    cols.map(([k, l]) => `<th class="sortable" onclick="sortBy('${k}')">${l}
      ${sortKey === k ? (sortDir < 0 ? '▼' : '▲') : ''}</th>`).join('') +
    '</tr>' + data.map((r, i) => `<tr class="clickable"
      onclick='pick(${JSON.stringify(JSON.stringify(r))})'>` +
      cols.map(([k]) => {
        let v = r[k];
        if (k === 'change_pct') return `<td class="${v >= 0 ? 'ok' : 'bad'}">
          ${v == null ? '—' : (v >= 0 ? '+' : '') + fmt(v) + '%'}</td>`;
        if (k === 'volume' || k === 'mcap') return `<td>${fmtBig(v)}</td>`;
        if (k === 'price' || k === 'pe' || k === 'rsi')
          return `<td>${fmt(v)}</td>`;
        return `<td>${v ?? '—'}</td>`;
      }).join('') + '</tr>').join('') + '</table>';
}

function pick(rjson) {
  sel = JSON.parse(rjson);
  document.getElementById('detail').style.display = 'block';
  document.getElementById('dtitle').textContent =
    `${sel.symbol} — ${sel.name || ''}`;
  document.getElementById('detail').scrollIntoView({behavior: 'smooth'});
  loadChart();
}
async function loadChart(rerenderOnly) {
  if (!sel) return;
  if (!rerenderOnly || !chartData) {
    document.getElementById('chart').innerHTML = '<p class="muted">loading…</p>';
    try {
      chartData = await api('/api/chart?symbol=' +
        encodeURIComponent(sel.symbol) + '&range=' +
        document.getElementById('range').value);
    } catch (e) {
      document.getElementById('chart').innerHTML =
        `<p class="bad">${e.message}</p>`;
      return;
    }
  }
  drawChart(document.getElementById('chart'), chartData, {
    sma20: document.getElementById('t-sma20').checked,
    sma50: document.getElementById('t-sma50').checked,
    volume: document.getElementById('t-vol').checked,
    rsi: document.getElementById('t-rsi').checked, height: 460});
}
window.addEventListener('resize', () => loadChart(true));

async function sendToPipeline() {
  if (!sel) return;
  try {
    const r = await api('/api/run', {ticker: sel.ticker || sel.symbol,
      exchange: ex(), currency: CCY[ex()],
      lot_size: ex() === 'SGX' ? 100 : 1});
    toast('launched ' + r.work_item_id + ' — watch it on Trading');
  } catch (e) { toast(e.message, false); }
}

async function search() {
  const found = await api('/api/search?q=' +
    encodeURIComponent(document.getElementById('q').value));
  document.getElementById('results').innerHTML =
    '<table><tr><th>symbol</th><th>name</th><th>exchange</th></tr>' +
    found.map(r => `<tr class="clickable" onclick='pick(${JSON.stringify(
      JSON.stringify({symbol: r.symbol, ticker: r.symbol, name: r.name}))})'>
      <td>${r.symbol}</td><td>${r.name || ''}</td><td>${r.exchange || ''}</td>
      </tr>`).join('') + '</table>';
}
loadExchange();
</script>
